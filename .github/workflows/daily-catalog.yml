name: Daily catalogue sync
on:
  schedule:
    - cron: '0 0 * * *'
      timezone: Asia/Beirut
  workflow_dispatch:
    inputs:
      apply:
        description: Apply catalogue updates and remove sold-out products/photos
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: daily-catalog-production
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          ALGOLIA_APP_ID: test-app
          ALGOLIA_ADMIN_KEY: test-key
      - name: Synchronize catalogue
        env:
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          EASYDROP_FEED_URL: ${{ secrets.EASYDROP_FEED_URL }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [ "$APPLY" = "true" ]; then
            npm run sync:daily -- --apply
          else
            npm run sync:daily
          fi
      - name: Save sync summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-sync-report
          path: sync-reports/*.json
          retention-days: 14
          if-no-files-found: ignore
